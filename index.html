<!doctype html>
<html lang="en" class="bg-[#FAF9F6]">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" />
    <title>The Fears Foundation | Dr. Constance Y. Fears, JD, PhD</title>
    <meta
      name="description"
      content="Dr. Constance Y. Fears, JD, PhD: scientist, regulatory expert, educator, entrepreneur, and advocate for expanding access to education. Explore the Fears Foundation scholarship portfolio."
    />
    <meta name="robots" content="index, follow" />

    <!-- An explicit icon link stops browsers falling back to /favicon.ico (404) -->
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Fears Foundation | Dr. Constance Y. Fears, JD, PhD" />
    <meta
      property="og:description"
      content="A legacy centered on education, mentorship, opportunity, and service."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Type system: Manrope (UI) + Fraunces (editorial display) + Jost (caps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Versioned asset URLs: GitHub Pages serves with long cache lives, so a
         bare stylesheet link goes stale for users after every deploy. Bump the
         query string on each release to force revalidation. -->
    <link rel="stylesheet" href="./dist/app.css?v=4" />
  </head>
  <body>
    <a
      href="#about"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-sharp focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-canvas"
      >Skip to content</a
    >

    <div id="root"></div>

    <script src="./dist/app.js?v=4" defer></script>
  </body>
</html>
